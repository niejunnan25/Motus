training_mode: "progress_stage2"

source:
  vgm_config: "configs/vgm_bridge_v1_proper_detailed_caption_v1_53f_full_jitter.yaml"
  vgm_checkpoint: "/mnt/workspace1/users/niejunnan/codebase/Motus/checkpoints/vgm_bridge_v1_proper_detailed_caption_v1_53f_full_jitter/vgm_bridge_v1_proper_lerobot_video_448x224_detailed_caption_v1_53f_full_jitter_2gpu_gbs8_30k/checkpoint_step_30000"

cache:
  # Deliberately identical to the serial config: both structures consume the
  # same generated trajectory and exact same single-frame query latents.
  cache_dir: "/mnt/workspace1/users/niejunnan/cache/motus_progress/v1_proper_detailed_53f_step30000_s50_53slot_v2"
  num_inference_steps: 50
  current_encode_batch_size: 16
  trajectory_frame_encode_batch_size: 16
  current_frame_stride: 1
  validation_fraction: 0.1
  dtype: "float16"
  seed: 20260713

progress_model:
  fusion_mode: "layerwise_wvm"
  # The output class k is the generated trajectory frame k, k=0...52.
  num_progress_bins: 53
  latent_channels: 48
  hidden_dim: 512
  num_heads: 8
  # Wan2.2 TI2V-5B has 30 blocks; Progress reads each block and never writes back.
  num_layers: 30
  ffn_multiplier: 4
  patch_size: [1, 2, 2]
  # Shared by current observations and every independently encoded memory frame.
  frame_num_tokens: 16
  view_encoding_mode: "joint"
  num_views: 1
  tokens_per_view: 16
  alignment_head_mode: "pooled_cosine"
  late_interaction_temperature: 0.07
  video_hidden_dim: 3072
  feature_timestep: 0.0
  dropout: 0.0

loss:
  # Gaussian soft-label standard deviation measured in generated-frame bins.
  target_sigma_bins: 2.0
  regression_weight: 1.0
  ranking_weight: 0.0
  ranking_minimum_gap: 0.05
  ranking_temperature: 0.1

training:
  # E: complete episodes loaded by each GPU for one optimizer step. The frozen
  # 5B WAN cost scales with E, so start Layerwise mixed batching conservatively.
  episode_batch_size: 1
  # Number of episode memories (and frozen-WAN feature passes) in one forward.
  episode_micro_batch_size: 1
  # Maximum flattened query count in one forward.
  query_batch_size: 8
  # Q=0 preserves the archived all-frame baseline. Mixed E>1 requires Q>0.
  queries_per_episode: 0
  # Same 20 complete passes over all frames as the serial ablation. The frozen
  # WAN feature pass is performed once per episode visit, not once per frame.
  max_epochs: 20
  # Safety ceiling; the scheduler uses actual distributed steps/epoch.
  max_steps: 50000
  seed: 20260713
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 250
  grad_clip_norm: 1.0
  max_episodes: null

system:
  checkpoint_dir: "./checkpoints/progress_stage2"
  save_interval: 250
  log_interval: 1
  checkpoint_limit: 20
  num_workers: 2
  pin_memory: true

logging:
  report_to: "wandb"
  wandb_project: "motus-progress"
  run_name: "progress_v1_proper_layerwise_wvm_53bin_s50_allframes_v2"

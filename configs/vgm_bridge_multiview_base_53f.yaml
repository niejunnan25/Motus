common:
  multiview_experiment: true
  num_video_frames: 52
  tail_condition_frames: 1
  conditioning_mode: "v1_mask_endpoint"
  mask_channels: 4
  video_height: 448
  video_width: 224
  global_downsample_rate: 3

  # Multi-view variables. MV0 keeps legacy RGB-mosaic behavior.
  multiview_mode: "legacy"
  num_views: 2
  multiview_layout: "vertical"
  multiview_output_layout: "vertical"
  view_capacity_mode: "shared"
  multiview_layer_indices: [2, 6, 10, 14, 18, 22, 26, 29]
  multiview_adapter_dim: 256
  multiview_adapter_heads: 8
  multiview_scene_tokens: 4
  multiview_consistency_weight: 0.1
  multiview_consistency_temperature: 0.07
  multiview_consistency_projection_dim: 128

  # Keep the matrix structural: no state, RoleMask, or interaction-loss supervision.
  state_condition_mode: "none"
  interaction_loss_enabled: false
  role_mask_fusion_mode: "none"
  # Legacy + no fusion is the established RGB-only path in VGMBridgeStage1.
  role_mask_training_mode: "legacy"
  role_mask_condition_mode: "legacy"

dataset:
  type: "video_bridge"
  dataset_dir:
    - "/mnt/workspace/users/niejunnan/lerobot_datasets/lerobot/libero"
  max_episodes: null
  require_language_embedding: true
  data_format: "lerobot_v3_video"
  image_column: "observation.images.image"
  image_columns: ["observation.images.image", "observation.images.image2"]
  view_names: ["high", "wrist"]
  view_layout: "vertical"
  return_separate_views: false
  load_state: false
  load_role_mask: false
  view_video_size: [224, 224]
  video_extensions: [".mp4"]
  cache_scan: false
  bridge_sampling_mode: "full_episode_uniform"
  bridge_sampling_jitter: true
  index_seeded_sampling: true
  task_language_embedding_dir: "/mnt/workspace1/users/niejunnan/dataset_sidecars/libero_caption_v1/umt5_wan_tasks"
  task_language_embedding_pattern: "task_{task_index:06d}.pt"
  task_language_caption_version: "libero_detailed_caption_v1"

training_mode: "vgm_bridge_stage1"

model:
  wan:
    config_path: "/mnt/workspace/users/niejunnan/codebase/Motus/pretrained_models/Wan2.2-TI2V-5B"
    checkpoint_path: "/mnt/workspace/users/niejunnan/codebase/Motus/pretrained_models/Wan2.2-TI2V-5B"
    vae_path: "/mnt/workspace/users/niejunnan/codebase/Motus/pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth"
    precision: "bfloat16"

training:
  batch_size: 4
  gradient_accumulation_steps: 1
  expected_global_batch_size: 8
  seed: 0
  max_steps: 50004
  learning_rate: 1.0e-5
  weight_decay: 0.01
  scheduler_type: "diffusers_cosine"
  warmup_steps: 1000
  lr_schedule_steps: 50004
  min_lr: 1.0e-6
  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false

system:
  checkpoint_dir: "./checkpoints"
  log_level: "INFO"
  log_interval: 1
  save_interval: 2500
  val_interval: 1000000000
  num_workers: 16
  pin_memory: true

logging:
  report_to: "wandb"
  wandb_project: "motus"
  tensorboard_log_dir: "tensorboard_logs"
  run_name: "vgm_bridge_multiview_base_53f_2gpu_gbs8_50k"

resume:
  checkpoint_path: null
  reset_scheduler: false

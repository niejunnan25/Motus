common:
  # Full video length is 1 + num_video_frames.
  # This 9-frame run uses first + 8 target frames:
  # condition_idx, condition_idx + 3, ..., condition_idx + 24.
  num_video_frames: 8
  video_height: 448
  video_width: 224

  global_downsample_rate: 3

dataset:
  # Pure video bridge dataset. This uses the standard LeRobot v3 LIBERO
  # layout:
  #   data/chunk-000/file-000.parquet
  #   meta/episodes/chunk-000/file-000.parquet
  #   videos/observation.images.image/chunk-000/file-000.mp4
  #   videos/observation.images.image2/chunk-000/file-000.mp4
  type: "video_bridge"
  dataset_dir:
    - "/mnt/workspace/users/niejunnan/lerobot_datasets/lerobot/libero"
  max_episodes: null
  require_language_embedding: false
  data_format: "lerobot_v3_video"
  image_column: "observation.images.image"
  image_columns: ["observation.images.image", "observation.images.image2"]
  view_layout: "vertical"
  video_extensions: [".mp4"]
  cache_scan: false

training_mode: "vgm_bridge_v0"

model:
  wan:
    config_path: "/mnt/workspace/users/niejunnan/codebase/Motus/pretrained_models/Wan2.2-TI2V-5B"
    checkpoint_path: "/mnt/workspace/users/niejunnan/codebase/Motus/pretrained_models/Wan2.2-TI2V-5B"
    vae_path: "/mnt/workspace/users/niejunnan/codebase/Motus/pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth"
    precision: "bfloat16"

training:
  # Per-GPU micro batch. With 2 GPUs and no gradient accumulation, the
  # effective global batch size is 8. Keep this matched to the 17-frame run
  # so the main variable is the bridge length.
  batch_size: 4
  gradient_accumulation_steps: 1
  max_steps: 50004
  learning_rate: 1.0e-5
  weight_decay: 0.01

  scheduler_type: "diffusers_cosine"
  warmup_steps: 1000
  lr_schedule_steps: 50004
  min_lr: 1.0e-6

  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false

system:
  checkpoint_dir: "./checkpoints"
  log_level: "INFO"
  log_interval: 1
  save_interval: 2500
  val_interval: 1000000000
  num_workers: 16
  pin_memory: true

logging:
  report_to: "wandb"
  wandb_project: "motus"
  tensorboard_log_dir: "tensorboard_logs"
  run_name: "vgm_bridge_v0_lerobot_video_448x224_9f_2gpu_gbs8_50k"

resume:
  checkpoint_path: null
  reset_scheduler: false

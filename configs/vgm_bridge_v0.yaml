common:
  # Full video length is 1 + num_video_frames.
  # For V0, 16 target frames gives 17 total frames, which gives more than
  # one middle latent slice after WAN VAE temporal compression.
  num_video_frames: 16
  video_height: 448
  video_width: 224

  global_downsample_rate: 3

dataset:
  # Pure video bridge dataset. For LIBERO upright, each task directory is
  # LeRobot parquet format:
  #   <task>/data/chunk-000/episode_000000.parquet
  #   <task>/meta/*.jsonl
  type: "video_bridge"
  dataset_dir:
    - "/mnt/workspace1/users/niejunnan/datasets/libero_lerobot_upright/libero_10"
    - "/mnt/workspace1/users/niejunnan/datasets/libero_lerobot_upright/libero_goal"
    - "/mnt/workspace1/users/niejunnan/datasets/libero_lerobot_upright/libero_object"
    - "/mnt/workspace1/users/niejunnan/datasets/libero_lerobot_upright/libero_spatial"
  max_episodes: null
  require_language_embedding: false
  data_format: "lerobot_parquet"
  image_column: "image"
  image_columns: ["image", "wrist_image"]
  view_layout: "vertical"
  video_extensions: [".mp4"]
  cache_scan: false

training_mode: "vgm_bridge_v0"

model:
  wan:
    config_path: "/mnt/workspace/users/niejunnan/codebase/Motus/pretrained_models/Wan2.2-TI2V-5B"
    checkpoint_path: "/mnt/workspace/users/niejunnan/codebase/Motus/pretrained_models/Wan2.2-TI2V-5B"
    vae_path: "/mnt/workspace/users/niejunnan/codebase/Motus/pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth"
    precision: "bfloat16"

training:
  batch_size: 1
  max_steps: 500000
  learning_rate: 1.0e-5
  weight_decay: 0.01

  scheduler_type: "diffusers_cosine"
  warmup_steps: 1000
  lr_schedule_steps: 500000
  min_lr: 1.0e-6

  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false

system:
  checkpoint_dir: "./checkpoints"
  log_level: "INFO"
  log_interval: 1
  save_interval: 10000
  val_interval: 1000000000
  num_workers: 16
  pin_memory: true

logging:
  report_to: "wandb"
  wandb_project: "motus"
  tensorboard_log_dir: "tensorboard_logs"
  run_name: "vgm_bridge_v0"

resume:
  checkpoint_path: null
  reset_scheduler: false
